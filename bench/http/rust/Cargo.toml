[package]
name = "xisto-http-bench"
version = "0.1.0"
edition = "2021"
publish = false
# binaries are named after the target (below), so bench/out holds them beside the Go ones
autobins = false

[[bin]]
name = "rust-hello"
path = "src/bin/hello.rs"

[[bin]]
name = "rust-todo"
path = "src/bin/todo.rs"

[[bin]]
name = "rust-deps"
path = "src/bin/deps.rs"

[[bin]]
name = "rust-client"
path = "src/bin/client.rs"

[dependencies]
axum = "0.8.9"
form_urlencoded = "1.2.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
# bench/http/build-native.sh strips the copies in bench/out with the system strip: rustc's own strip step runs
# rust-objcopy, which fails on some rustup installs (missing libLLVM.dylib)
strip = false
