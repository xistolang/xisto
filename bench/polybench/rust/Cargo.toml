[package]
name = "polybench-rs"
version = "0.2.0"
authors = ["Joseph Rafael Ferrer <rafael2x0@gmail.com>"]
edition = "2018"
publish = false
# one binary per kernel, named as the C program (bench/polybench/PROVENANCE.md)
autobins = false
license = "GPLv2"

[features]
print-result = []

[dependencies]
[profile.release]
opt-level = 3
codegen-units = 1

[[bin]]
name = "2mm"
path = "src/bin/2mm.rs"

[[bin]]
name = "3mm"
path = "src/bin/3mm.rs"

[[bin]]
name = "adi"
path = "src/bin/adi.rs"

[[bin]]
name = "atax"
path = "src/bin/atax.rs"

[[bin]]
name = "bicg"
path = "src/bin/bicg.rs"

[[bin]]
name = "cholesky"
path = "src/bin/cholesky.rs"

[[bin]]
name = "correlation"
path = "src/bin/correlation.rs"

[[bin]]
name = "covariance"
path = "src/bin/covariance.rs"

[[bin]]
name = "deriche"
path = "src/bin/deriche.rs"

[[bin]]
name = "doitgen"
path = "src/bin/doitgen.rs"

[[bin]]
name = "durbin"
path = "src/bin/durbin.rs"

[[bin]]
name = "fdtd-2d"
path = "src/bin/fdtd_2d.rs"

[[bin]]
